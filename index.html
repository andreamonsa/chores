<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Whose Turn Is It</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <p class="eyebrow">This week's cleaner</p>
    <section class="current-card">
      <p class="current-label">It's your turn,</p>
      <h1 class="current-name" id="current-name">—</h1>
      <p class="current-range" id="current-range">—</p>
      <p class="last-week" id="last-week">—</p>
    </section>

    <section class="upcoming">
      <h2>Up next</h2>
      <ul id="upcoming-list"></ul>
    </section>

    <footer>Weeks run Monday – Sunday</footer>
  </main>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
